<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>friendlypass web login</title>
  <style>
    body { font-family: sans-serif; margin: 24px; background: #f7f9f3; color: #1a1c18; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 24px; font-size: 0.85rem; color: #43483f; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px;
            font-size: 1rem; border: 1px solid #b9c2b2; border-radius: 8px; background: #fff; }
    button { margin-top: 24px; width: 100%; padding: 14px; font-size: 1rem; border: 0;
             border-radius: 20px; background: #3e6b38; color: #fff; }
    p { font-size: 0.85rem; color: #43483f; }
  </style>
</head>
<body>
  <h1>Web login</h1>
  <p>Served from https://appassets.androidplatform.net/ by WebViewAssetLoader.</p>
  <form autocomplete="on">
    <label for="username">Username or email</label>
    <input id="username" name="username" type="text" autocomplete="username"
           autocapitalize="none" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="button" id="signin">Sign in</button>
  </form>
</body>
</html>
