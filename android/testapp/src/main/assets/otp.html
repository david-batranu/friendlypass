<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>friendlypass one-time code</title>
  <style>
    body { font-family: sans-serif; margin: 24px; background: #f7f9f3; color: #1a1c18; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 24px; font-size: 0.85rem; color: #43483f; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px;
            font-size: 1rem; border: 1px solid #b9c2b2; border-radius: 8px; background: #fff; }
    button { margin-top: 24px; width: 100%; padding: 14px; font-size: 1rem; border: 0;
             border-radius: 20px; background: #3e6b38; color: #fff; }
    p { font-size: 0.85rem; color: #43483f; }
  </style>
</head>
<body>
  <h1>Two-step verification</h1>
  <p>Enter the one-time code from your authenticator app.</p>
  <form autocomplete="on">
    <label for="otp">One-time code</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6"
           autocomplete="one-time-code" spellcheck="false">
    <button type="button" id="verify">Verify</button>
  </form>
</body>
</html>
