[package]
name = "friendlypass"
description = "friendlypass core engine + CLI: a Rust reimplementation of KeePassXC's headless core, built on the keepass crate"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Desktop/CLI surface: argument parsing, password prompts, challenge-response
# keys, import/export formats and the `friendlypass` binary. Mobile builds use
# `default-features = false` and only need `matching` (plus `saveutil`).
default = ["cli"]
cli = [
    "dep:clap",
    "dep:rpassword",
    "dep:zip",
    "keepass/challenge_response",
]

[[bin]]
name = "friendlypass"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4", "totp", "_merge"] }
rust-argon2 = "3.0"
clap = { version = "4", features = ["derive"], optional = true }
rpassword = { version = "7", optional = true }
anyhow = "1"
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
getrandom = "0.4"
quick-xml = "0.42.0"
uuid = "1.29.3"
base64 = "0.23.1"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
zip = { version = "2", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
csv = "1.4"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
twofish = "0.7"

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3"
