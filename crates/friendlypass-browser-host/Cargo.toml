[package]
name = "friendlypass-browser-host"
description = "friendlypass native-messaging host: stdio <-> app socket bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
friendlypass-browser = { path = "../friendlypass-browser" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
serde_json = "1"
