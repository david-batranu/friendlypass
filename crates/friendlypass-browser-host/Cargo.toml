[package]
name = "friendlypass-browser-host"
description = "friendlypass native-messaging host: stdio <-> app socket bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
friendlypass-browser = { path = "../friendlypass-browser" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
# Parent-process lookup, Authenticode verification and the named-pipe link.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"
