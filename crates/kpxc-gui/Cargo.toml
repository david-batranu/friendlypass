[package]
name = "kpxc-gui"
description = "Cross-platform GUI for the Rust KeePassXC migration, built on BUI (Blender's UI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blenderui = { version = "0.5.1", default-features = false, features = ["freetype", "png", "svg", "jpeg", "gpu"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
keepass = { version = "0.17.0", features = ["save_kdbx4", "challenge_response", "totp"] }
kpxc = { path = "../kpxc" }
kpxc-gui-config = { path = "../kpxc-gui-config" }
rfd = "0.18.0"
rust-argon2 = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
png = "0.17"
