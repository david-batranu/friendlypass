[package]
name = "kpxc-gui"
description = "Cross-platform GUI for the Rust KeePassXC migration (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37.0", features = ["serde"] }
enigo = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "webp", "bmp"] }
keepass = { version = "0.17.0", features = ["save_kdbx4", "challenge_response", "totp"] }
kpxc = { path = "../kpxc" }
kpxc-ssh-agent = { path = "../kpxc-ssh-agent" }
kpxc-browser = { path = "../kpxc-browser" }
resvg = { version = "0.47.0", default-features = false }
rfd = "0.18.0"
rust-argon2 = "3.0.0"
ureq = "3.3.0"
uuid = "1.29.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
ed25519-dalek = "3.0.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3.27.0"
