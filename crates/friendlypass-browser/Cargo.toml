[package]
name = "friendlypass-browser"
description = "friendlypass browser integration: KeePassXC-Browser protocol server (keepassxc-proxy compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crypto_box = "0.9"
getrandom = "0.4"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
keepass = { version = "0.17.0", features = ["totp", "save_kdbx4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# App-side peer verification: cdhash comparison needs CoreFoundation types
# (the Security framework calls themselves are declared in `src/peer.rs`).
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
# Used only by `examples/test_server.rs`, the headless protocol server the
# Phase-1 never-disconnect e2e suite runs against fixtures/sample4.kdbx.
friendlypass = { path = "../friendlypass" }

[[example]]
name = "test_server"
required-features = []
