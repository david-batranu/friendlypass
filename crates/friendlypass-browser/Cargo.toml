[package]
name = "friendlypass-browser"
description = "friendlypass browser integration: KeePassXC-Browser protocol server (keepassxc-proxy compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crypto_box = "0.9"
getrandom = "0.4"
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
friendlypass-passkey = { path = "../friendlypass-passkey" }
libc = "0.2"
keepass = { version = "0.17.0", features = ["totp", "save_kdbx4"] }
# URL/app matching is shared with the Android vault (`friendlypass::matching`).
# The browser only needs the dependency-free part of the core crate.
friendlypass = { path = "../friendlypass", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# App-side peer verification: cdhash comparison needs CoreFoundation types
# (the Security framework calls themselves are declared in `src/peer.rs`).
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }

[[example]]
name = "test_server"
required-features = []
