[package]
name = "kpxc"
description = "KeePassXC core engine + CLI, migrated to Rust (built on the keepass crate)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
rust-argon2 = "3.0"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
