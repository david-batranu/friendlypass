[package]
name = "kpxc"
description = "KeePassXC core engine + CLI, migrated to Rust (built on the keepass crate)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4", "challenge_response", "totp"] }
rust-argon2 = "3.0"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
anyhow = "1"
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
getrandom = "0.4"
quick-xml = "0.42.0"
uuid = "1.29.3"
base64 = "0.23.1"
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
zip = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3"
