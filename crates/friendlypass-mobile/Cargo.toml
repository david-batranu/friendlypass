[package]
name = "friendlypass-mobile"
description = "UniFFI boundary for the friendlypass Android vault (friendlypass_mobile)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "friendlypass_mobile"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# The bindgen binary is a host build-time tool. Keeping it (and uniffi's
# `cli` feature) behind an opt-in feature means the Android cdylib does not
# carry the bindgen machinery.
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
# The core crate without its desktop/CLI surface (clap, rpassword,
# challenge-response/USB): the mobile build only needs URL matching.
friendlypass = { path = "../friendlypass", default-features = false }
friendlypass-passkey = { path = "../friendlypass-passkey" }
keepass = { version = "0.17", features = ["save_kdbx4", "totp"] }
thiserror = "2"
# Wipe passwords and keyfile bytes once they have been folded into the key.
zeroize = "1"
uniffi = "0.32"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
