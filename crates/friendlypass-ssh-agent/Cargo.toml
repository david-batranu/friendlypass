[package]
name = "friendlypass-ssh-agent"
description = "friendlypass SSH agent (RFC draft-miller subset): serves SSH keys from database entries"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
anyhow = "1"
rpassword = "7"

[dev-dependencies]
tempfile = "3.27.0"
