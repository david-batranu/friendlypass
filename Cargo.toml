[workspace]
resolver = "2"
members = ["crates/friendlypass", "crates/friendlypass-gui", "crates/friendlypass-ssh-agent", "crates/friendlypass-browser", "crates/friendlypass-browser-host", "crates/friendlypass-mobile", "crates/friendlypass-passkey"]

# Local patch: challenge_response 0.5.46's nusb backend calls the Linux-only
# `DeviceInfo::busnum()` unconditionally and does not build on macOS.
# The vendored copy adds a small platform shim; we only use the software
# `LocalChallenge` component (no USB transport), so behavior is unchanged.
[patch.crates-io]
challenge_response = { path = "vendor/challenge-response" }

[workspace.package]
edition = "2021"
version = "0.1.3"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"

# Test fixtures (fixtures/sample4.kdbx) use KDBX3 AES-KDF with ~14M rounds.
# Unoptimised dev builds spent ~5.7 s in that loop before the test_server
# example could bind its socket, against a 10 s readiness wait in the
# browser-host tests. Optimising the KDF crates keeps dev/test builds fast.
[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.generic-array]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.keepass]
opt-level = 3
