name: release

# Pushing a version tag (vX.Y.Z) builds every artifact and publishes one
# GitHub Release. `workflow_dispatch` is the same build as a dry run: artifacts
# are uploaded to the run, no release is created and Android stays unsigned
# unless the signing secrets happen to be configured.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a tag build halfway through publishing a release.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every package version agrees
        id: check
        run: |
          set -euo pipefail

          cargo_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          npm_version=$(awk -F'"' '/^  "version": "/ { print $4; exit }' extension/package.json)
          manifest_version=$(awk -F'"' '/^  "version": "/ { print $4; exit }' extension/src/manifest.json)
          android_version=$(awk -F'"' '/^val appVersionName = "/ { print $2; exit }' android/app/build.gradle.kts)

          if [ -z "$cargo_version" ]; then
            echo "::error file=Cargo.toml::cannot read the workspace version"
            exit 1
          fi

          status=0
          check() {
            local file="$1"
            local actual="$2"
            if [ -z "$actual" ]; then
              echo "::error file=$file::cannot read a version"
              status=1
            elif [ "$actual" != "$cargo_version" ]; then
              echo "::error file=$file::version $actual does not match Cargo.toml ($cargo_version)"
              status=1
            fi
          }
          check extension/package.json "$npm_version"
          check extension/src/manifest.json "$manifest_version"
          check android/app/build.gradle.kts "$android_version"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version"
              status=1
            fi
          fi

          if [ "$status" -ne 0 ]; then
            exit 1
          fi

          echo "All package versions are $cargo_version"
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple silicon; the -intel label is the x86_64 runner
          # (macos-13 has been retired by GitHub).
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build friendlypass.app (GUI + browser host)
        run: ./packaging/macos/package.sh release

      - name: Zip the app bundle
        run: |
          set -euo pipefail
          cd target/release
          # --keepParent keeps friendlypass.app/ as the archive root, so unzipping
          # yields a valid bundle instead of loose Contents/ files.
          ditto -c -k --keepParent friendlypass.app \
            "friendlypass-${VERSION}-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/release/friendlypass-*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low enough for most users.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev

      - name: Build the Linux tarball (GUI + browser host)
        run: ./packaging/linux/package.sh release

      - name: Sanity-check the tarball name
        run: |
          set -euo pipefail
          test -f "target/release/friendlypass-${VERSION}-linux-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/friendlypass-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Browser integration and the SSH agent are Unix-socket features and are
      # cfg-gated off on Windows; the GUI builds and starts without them.
      - name: Build GUI and CLI
        run: cargo build --release -p friendlypass -p friendlypass-gui

      - name: Package the executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/friendlypass-gui.exe dist/
          Copy-Item target/release/friendlypass.exe dist/
          # GPL-3.0: ship the licence and notices with the binaries.
          Copy-Item LICENSE dist/
          Copy-Item NOTICE.md dist/
          Compress-Archive -Path dist/* -DestinationPath "friendlypass-$env:VERSION-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: friendlypass-${{ needs.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Point Gradle and cargo-ndk at the NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Android and desktop target dirs never share objects.
          key: android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Decode signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=""
          missing=0
          for value in \
            "${ANDROID_KEYSTORE_BASE64:-}" \
            "${ANDROID_KEYSTORE_PASSWORD:-}" \
            "${ANDROID_KEY_ALIAS:-}" \
            "${ANDROID_KEY_PASSWORD:-}"; do
            [ -n "$value" ] || missing=1
          done

          if [ "$missing" -eq 0 ]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            chmod 600 "$keystore"
            # The secret carries no filename; keep the real format for AGP.
            # PKCS#12 (DER) starts with 0x30, the JKS magic with 0xFE.
            if [ "$(head -c 1 "$keystore" | od -An -tx1 | tr -d ' ')" = "30" ]; then
              mv "$keystore" "$RUNNER_TEMP/release.p12"
              keystore="$RUNNER_TEMP/release.p12"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::all four Android signing secrets are required for tag releases"
            exit 1
          elif [ -n "${ANDROID_KEYSTORE_BASE64:-}${ANDROID_KEYSTORE_PASSWORD:-}${ANDROID_KEY_ALIAS:-}${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Android signing secrets are partially configured"
            exit 1
          else
            echo "::warning::Android signing secrets are not configured; building an unsigned APK (dry run)"
          fi

          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          FP_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature and rename
        env:
          SIGNING_KEYSTORE: ${{ steps.signing.outputs.keystore }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          if [ -n "$SIGNING_KEYSTORE" ]; then
            apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
            test -n "$apksigner"
            "$apksigner" verify --print-certs "$apk"
          else
            echo "Dry run: APK is unsigned on purpose"
          fi
          mkdir -p dist
          cp "$apk" "dist/friendlypass-${VERSION}-android.apk"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/friendlypass-${{ needs.version.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 14

  extension:
    name: browser extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci --prefer-offline

      - name: Package Chrome and Firefox zips
        working-directory: extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/artifacts/friendlypass-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos, linux, windows, android, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A retried run must be able to replace the assets it built before.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "friendlypass $VERSION" \
              --notes "friendlypass $VERSION: desktop app for macOS (Apple silicon/Intel), Linux (x86_64/aarch64) and Windows (x86_64), the signed Android APK and the Chrome/Firefox extension zips. See SHA256SUMS for checksums."
          fi
