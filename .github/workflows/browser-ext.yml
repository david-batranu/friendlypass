name: browser-ext

on:
  push:
    paths:
      - "extension/**"
      - "crates/friendlypass-browser/**"
      - "crates/friendlypass-browser-host/**"
      - "protocol/**"
      - "installer/**"
      - "packaging/**"
      - "scripts/e2e.sh"
      - ".github/workflows/browser-ext.yml"
  pull_request:
    paths:
      - "extension/**"
      - "crates/friendlypass-browser/**"
      - "crates/friendlypass-browser-host/**"
      - "protocol/**"
      - "installer/**"
      - "packaging/**"
      - "scripts/e2e.sh"
      - ".github/workflows/browser-ext.yml"
  workflow_dispatch:

concurrency:
  group: browser-ext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: browser-ext (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cargo protocol conformance (frozen fixture test)
        run: cargo test -p friendlypass-browser --test fixtures_crypto

      - name: Cargo protocol + native-host tests
        run: cargo test -p friendlypass-browser -p friendlypass-browser-host

      - name: Native-messaging installer tests
        run: ./installer/tests/install.sh

      - name: npm ci
        working-directory: extension
        run: npm ci

      - name: Extension build
        working-directory: extension
        run: npm run build

      - name: Extension typecheck
        working-directory: extension
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: extension
        run: npm test

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: extension
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS)
        if: runner.os == 'macOS'
        working-directory: extension
        run: npx playwright install chromium

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Playwright harness + e2e
        env:
          FP_HOST: auto
          # Headed under Xvfb on Linux (most reliable extension loading);
          # new-headless Chromium on macOS.
          FP_HEADED: ${{ runner.os == 'Linux' && '1' || '0' }}
          FP_SKIP_BROWSER_INSTALL: "1"
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: extension/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Tag builds: ship the macOS app bundle (GUI + native host) and the Linux
  # tarball. Extension zips come from WP9's `npm run package`; the steps are
  # skipped gracefully while that script does not exist yet.
  release:
    name: release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build macOS app bundle (GUI + browser host)
        if: runner.os == 'macOS'
        run: ./packaging/macos/package.sh release

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd target/release
          ditto -c -k --sequesterRsrc --keepParent friendlypass.app \
            "friendlypass-${GITHUB_REF_NAME}-macos.zip"

      - name: Build Linux tarball (GUI + browser host)
        if: runner.os == 'Linux'
        run: ./packaging/linux/package.sh release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendlypass-app-${{ runner.os }}
          path: |
            target/release/friendlypass-*.zip
            target/release/friendlypass-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Extension packages (optional, added by WP9)
        working-directory: extension
        run: |
          npm ci
          npm run package --if-present

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendlypass-extension-${{ runner.os }}
          path: |
            extension/dist/**/*.zip
            extension/*.zip
          if-no-files-found: ignore
          retention-days: 14
